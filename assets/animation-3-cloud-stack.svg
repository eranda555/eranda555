<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
    <radialGradient id="cloud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="#0d1117" />

  <!-- Center axis line (connecting all layers) -->
  <line x1="200" y1="75" x2="200" y2="440" stroke="#30363d" stroke-width="2" />

  <!-- ===== LAYER 1: CLOUD ===== -->
  <!-- Cloud glow -->
  <circle cx="200" cy="50" r="60" fill="url(#cloud-glow)" />

  <!-- Cloud shape -->
  <g transform="translate(200, 50)">
    <path d="M-35,0 
             A18,18 0 0,1 -12,-25 
             A22,22 0 0,1 25,-18 
             A16,16 0 0,1 35,5 
             L-30,5 
             A10,10 0 0,1 -35,0Z" 
          fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,3" />
    <text x="0" y="22" fill="#8b949e" font-family="'Courier New', Consolas, monospace" font-size="11" text-anchor="middle">CLOUD LAYER</text>
  </g>

  <!-- ===== LAYER 2: FIREWALL ===== -->
  <g transform="translate(200, 120)">
    <!-- Connecting line from cloud -->
    <line x1="0" y1="-20" x2="0" y2="-10" stroke="#30363d" stroke-width="2" />

    <!-- Shield -->
    <polygon points="0,-30 25,-15 0,30 -25,-15" fill="none" stroke="#3fb950" stroke-width="2">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </polygon>
    <!-- Checkmark -->
    <polyline points="-10,0 -3,8 12,-8" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
    </polyline>
    <text x="0" y="38" fill="#8b949e" font-family="'Courier New', Consolas, monospace" font-size="11" text-anchor="middle">FIREWALL</text>
  </g>

  <!-- ===== LAYER 3: LOAD BALANCER ===== -->
  <g transform="translate(200, 190)">
    <!-- Connecting line from firewall -->
    <line x1="0" y1="-40" x2="0" y2="-20" stroke="#30363d" stroke-width="2" />

    <!-- Diamond -->
    <polygon points="0,-20 25,0 0,20 -25,0" fill="none" stroke="#56d4dd" stroke-width="2" />
    <!-- Internal diamond accent -->
    <polygon points="0,-10 12,0 0,10 -12,0" fill="none" stroke="#56d4dd" stroke-width="1" opacity="0.5" />
    <text x="0" y="35" fill="#8b949e" font-family="'Courier New', Consolas, monospace" font-size="11" text-anchor="middle">LOAD BALANCER</text>

    <!-- Branching lines (alternating) -->
    <line x1="-30" y1="70" x2="-30" y2="30" stroke="#30363d" stroke-width="2" />
    <line x1="30" y1="70" x2="30" y2="30" stroke="#30363d" stroke-width="2" />
    <line x1="-30" y1="30" x2="0" y2="20" stroke="#56d4dd" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="0s" repeatCount="indefinite" />
    </line>
    <line x1="30" y1="30" x2="0" y2="20" stroke="#56d4dd" stroke-width="2" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="2s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- ===== LAYER 4: APP SERVERS ===== -->
  <!-- App Server 1 -->
  <g transform="translate(130, 260)">
    <!-- Connecting line from load balancer -->
    <line x1="0" y1="-30" x2="0" y2="-10" stroke="#30363d" stroke-width="2" />

    <!-- Rack -->
    <rect x="-20" y="-10" width="40" height="50" rx="3" fill="none" stroke="#58a6ff" stroke-width="2" />
    <!-- Rack slots -->
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#30363d" stroke-width="1.5" />
    <line x1="-15" y1="12" x2="15" y2="12" stroke="#30363d" stroke-width="1.5" />
    <line x1="-15" y1="24" x2="15" y2="24" stroke="#30363d" stroke-width="1.5" />
    <!-- LEDs -->
    <circle cx="12" cy="4" r="2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="0s" repeatCount="indefinite" />
    </circle>
    <circle cx="12" cy="16" r="2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="0.7s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="50" fill="#8b949e" font-family="'Courier New', Consolas, monospace" font-size="10" text-anchor="middle">APP 01</text>
  </g>

  <!-- App Server 2 -->
  <g transform="translate(270, 260)">
    <!-- Connecting line from load balancer -->
    <line x1="0" y1="-30" x2="0" y2="-10" stroke="#30363d" stroke-width="2" />

    <!-- Rack -->
    <rect x="-20" y="-10" width="40" height="50" rx="3" fill="none" stroke="#58a6ff" stroke-width="2" />
    <!-- Rack slots -->
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#30363d" stroke-width="1.5" />
    <line x1="-15" y1="12" x2="15" y2="12" stroke="#30363d" stroke-width="1.5" />
    <line x1="-15" y1="24" x2="15" y2="24" stroke="#30363d" stroke-width="1.5" />
    <!-- LEDs -->
    <circle cx="12" cy="4" r="2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="12" cy="16" r="2" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="1s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="50" fill="#8b949e" font-family="'Courier New', Consolas, monospace" font-size="10" text-anchor="middle">APP 02</text>
  </g>

  <!-- Convergence lines from both app servers to DB -->
  <line x1="130" y1="310" x2="180" y2="400" stroke="#30363d" stroke-width="2" />
  <line x1="270" y1="310" x2="220" y2="400" stroke="#30363d" stroke-width="2" />

  <!-- ===== LAYER 5: DATABASE ===== -->
  <g transform="translate(200, 420)">
    <!-- DB Cylinder -->
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-20" rx="40" ry="10" fill="none" stroke="#d29922" stroke-width="2" />
    <!-- Bottom ellipse -->
    <ellipse cx="0" cy="20" rx="40" ry="10" fill="none" stroke="#d29922" stroke-width="2" />
    <!-- Connecting body -->
    <line x1="-40" y1="-10" x2="-40" y2="20" stroke="#d29922" stroke-width="2" />
    <line x1="40" y1="-10" x2="40" y2="20" stroke="#d29922" stroke-width="2" />

    <!-- DB internal lines (subtle) -->
    <line x1="-40" y1="-5" x2="40" y2="-5" stroke="#d29922" stroke-width="0.5" opacity="0.3" />
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#d29922" stroke-width="0.5" opacity="0.3" />
    <line x1="-40" y1="5" x2="40" y2="5" stroke="#d29922" stroke-width="0.5" opacity="0.3" />
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#d29922" stroke-width="0.5" opacity="0.3" />
    <line x1="-40" y1="15" x2="40" y2="15" stroke="#d29922" stroke-width="0.5" opacity="0.3" />

    <text x="0" y="40" fill="#8b949e" font-family="'Courier New', Consolas, monospace" font-size="11" text-anchor="middle">DATABASE</text>
  </g>

  <!-- ===== ANIMATED PARTICLES (data flowing down) ===== -->

  <!-- Particle 1 - Teal, moves top to bottom -->
  <circle cx="200" cy="50" r="4" fill="#56d4dd">
    <animate attributeName="cy" values="50;440" dur="6s" repeatCount="indefinite" begin="0s" />
    <animate attributeName="opacity" values="1;0.8;0" dur="6s" repeatCount="indefinite" begin="0s" />
  </circle>

  <!-- Particle 2 - Teal, staggered -->
  <circle cx="200" cy="50" r="4" fill="#56d4dd">
    <animate attributeName="cy" values="50;440" dur="6s" repeatCount="indefinite" begin="2s" />
    <animate attributeName="opacity" values="1;0.8;0" dur="6s" repeatCount="indefinite" begin="2s" />
  </circle>

  <!-- Particle 3 - Teal, staggered -->
  <circle cx="200" cy="50" r="4" fill="#56d4dd">
    <animate attributeName="cy" values="50;440" dur="6s" repeatCount="indefinite" begin="4s" />
    <animate attributeName="opacity" values="1;0.8;0" dur="6s" repeatCount="indefinite" begin="4s" />
  </circle>

  <!-- Particle 4 - Green, sparse upward (response) -->
  <circle cx="200" cy="430" r="3" fill="#3fb950">
    <animate attributeName="cy" values="430;60" dur="8s" repeatCount="indefinite" begin="3s" />
    <animate attributeName="opacity" values="0;0.8;1;0.5;0" dur="8s" repeatCount="indefinite" begin="3s" />
  </circle>

  <!-- Particle 5 - Second response, even more staggered -->
  <circle cx="200" cy="430" r="3" fill="#3fb950">
    <animate attributeName="cy" values="430;60" dur="8s" repeatCount="indefinite" begin="7s" />
    <animate attributeName="opacity" values="0;0.8;1;0.5;0" dur="8s" repeatCount="indefinite" begin="7s" />
  </circle>
</svg>